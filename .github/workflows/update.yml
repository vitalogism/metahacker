name: Read the instruments

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh points and look for new Hacker-X posts
        run: python3 scripts/update.py
      - name: Commit if anything moved
        run: |
          if git diff --quiet data/events.json index.html; then
            echo "No change."
            exit 0
          fi
          git config user.name "metahacker-instruments"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json index.html
          git commit -m "Instrument reading $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
